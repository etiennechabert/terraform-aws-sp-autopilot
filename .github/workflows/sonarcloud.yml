name: SonarCloud Analysis

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lambda-tests-and-sonar:
    name: Lambda Tests & SonarCloud
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full git history for SonarCloud blame

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            lambda/scheduler/requirements-ci.lock
            lambda/purchaser/requirements-ci.lock
            lambda/reporter/requirements-ci.lock

      - name: Install all dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes --only-binary :all: -r lambda/scheduler/requirements-ci.lock
          pip install --require-hashes --only-binary :all: -r lambda/purchaser/requirements-ci.lock
          pip install --require-hashes --only-binary :all: -r lambda/reporter/requirements-ci.lock

      - name: Run all Lambda tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/lambda
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "::group::Scheduler Tests"
          cd lambda/scheduler && pytest && cd ../..
          echo "::endgroup::"

          echo "::group::Purchaser Tests"
          cd lambda/purchaser && pytest && cd ../..
          echo "::endgroup::"

          echo "::group::Reporter Tests"
          cd lambda/reporter && pytest && cd ../..
          echo "::endgroup::"

      - name: Verify Coverage Files
        run: |
          echo "Coverage files:"
          find lambda -name "coverage.xml" -exec echo "  {}" \;

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=false
            -Dsonar.verbose=false
