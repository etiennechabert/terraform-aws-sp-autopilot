name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Fast validation checks (run first)
  terraform-validation:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.11.0"

      - name: Terraform Format Check
        id: fmt
        run: |
          # Format check for .tf files only (tftest.hcl files are not supported by terraform fmt)
          find . -name "*.tf" -not -path "*/.terraform/*" -exec terraform fmt -check {} +
        continue-on-error: false

      - name: Terraform Init
        id: init
        run: terraform init -backend=false
        continue-on-error: false

      - name: Terraform Validate
        id: validate
        run: terraform validate
        continue-on-error: false

      - name: Comment PR with Results
        if: false # Disabled: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Validation Failed

            **Format Check:** \`${{ steps.fmt.outcome }}\`
            **Initialization:** \`${{ steps.init.outcome }}\`
            **Validation:** \`${{ steps.validate.outcome }}\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  tfsec-scan:
    name: tfsec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          soft_fail: false
          format: default
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_args: --minimum-severity HIGH --exclude aws-s3-encryption-customer-key,aws-sqs-queue-encryption-use-cmk,aws-iam-no-policy-wildcards

      - name: Run tfsec with SARIF output
        if: always()
        uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608 # v0.1.4
        with:
          sarif_file: tfsec-results.sarif
          tfsec_args: --minimum-severity HIGH --exclude aws-s3-encryption-customer-key,aws-sqs-queue-encryption-use-cmk,aws-iam-no-policy-wildcards
        continue-on-error: true

      - name: Upload SARIF file
        if: always() && hashFiles('tfsec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      - name: Comment PR with Security Issues
        if: false # Disabled: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Security Scan Failed

            **tfsec found HIGH or CRITICAL security issues in your Terraform code.**

            Please review the security findings above and address them before merging.

            Common fixes:
            - Enable encryption for resources
            - Restrict security group rules
            - Enable logging and monitoring
            - Use secure default configurations

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # Stage 1: Fast validation checks (run first)
  lint:
    name: Python Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install ruff
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes --only-binary :all: -r .github/requirements-lint.lock

      - name: Run ruff check
        run: |
          ruff check lambda/

      - name: Run ruff format check
        run: |
          ruff format --check lambda/

      - name: Comment PR with Linting Results
        if: false # Disabled: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Python Linting Failed

            **Ruff linting or formatting checks failed.**

            Please run the following commands locally to fix:
            - \`ruff check --fix lambda/\`
            - \`ruff format lambda/\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  docs-check:
    name: Terraform Docs Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://terraform-docs.io/dl/v0.19.0/terraform-docs-v0.19.0-$(uname)-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
      - name: Check docs are up-to-date
        run: terraform-docs . --output-check

  # Stage 2: Lambda tests (runs after Stage 1 passes)
  lambda-tests:
    needs: [terraform-validation, tfsec-scan, lint, docs-check]
    name: Lambda Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            lambda/scheduler/requirements-ci.lock
            lambda/purchaser/requirements-ci.lock
            lambda/reporter/requirements-ci.lock

      - name: Install all dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes --only-binary :all: -r lambda/scheduler/requirements-ci.lock
          pip install --require-hashes --only-binary :all: -r lambda/purchaser/requirements-ci.lock
          pip install --require-hashes --only-binary :all: -r lambda/reporter/requirements-ci.lock

      - name: Run all Lambda tests
        env:
          PYTHONPATH: ${{ github.workspace }}/lambda
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "::group::Scheduler Tests"
          cd lambda/scheduler && pytest && cd ../..
          echo "::endgroup::"

          echo "::group::Purchaser Tests"
          cd lambda/purchaser && pytest && cd ../..
          echo "::endgroup::"

          echo "::group::Reporter Tests"
          cd lambda/reporter && pytest && cd ../..
          echo "::endgroup::"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lambda/scheduler/coverage.xml,./lambda/purchaser/coverage.xml,./lambda/reporter/coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage reports for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lambda-coverage
          path: |
            lambda/scheduler/coverage.xml
            lambda/purchaser/coverage.xml
            lambda/reporter/coverage.xml
          if-no-files-found: error
          retention-days: 1

  # Stage 3: SonarCloud analysis (reuses the Lambda Tests coverage; nothing depends on it)
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [lambda-tests]
    # Dependabot PRs run without repository secrets, so SONAR_TOKEN is empty and
    # the scan can only fail. Key on the PR author, not github.actor, so a
    # maintainer re-running the job doesn't flip this back on.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full git history for SonarCloud blame
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-coverage
          path: lambda

      # On a PR, wait for the quality gate and fail the job when it fails;
      # otherwise the scan only uploads and red gates merge unnoticed. Pushes to
      # main only upload: main's gate covers its whole new-code period, which
      # PRs already gate slice by slice.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}

  # Stage 3: Terraform unit tests (runs after Lambda tests complete successfully)
  terraform-unit-tests:
    name: Terraform Unit Tests
    runs-on: ubuntu-latest
    needs: [terraform-validation, tfsec-scan, lint, docs-check, lambda-tests]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.11.0"

      - name: Verify Terraform Version
        run: |
          terraform version
          terraform version | grep -E "v1\.1[1-9]|v1\.[2-9][0-9]|v[2-9]" || (echo "ERROR: Terraform 1.11+ required for override_during support" && exit 1)

      - name: Verify AWS Credentials NOT Set
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] || [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: AWS credentials should not be set for these tests"
            exit 1
          fi

      - name: Initialize Terraform
        run: terraform init

      # `terraform test` takes no positional file arguments; without
      # -test-directory it only looks in ./tests and silently runs 0 tests.
      - name: Run all Terraform Unit Tests
        run: terraform test -test-directory=terraform-tests/unit

  # Stage 2b: Terraform integration tests (runs after fast checks, parallel with Lambda tests)
  terraform-integration-tests:
    name: Terraform Integration Tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    needs: [terraform-validation, tfsec-scan, lint, docs-check]
    environment: ${{ github.event_name == 'pull_request' && 'aws-integration' || 'aws-integration-auto' }}
    concurrency:
      group: aws-integration-tests
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      AWS_DEFAULT_REGION: us-east-1
      GO_VERSION: '1.26'
      TERRAFORM_VERSION: '1.11.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: terraform-tests/integration/go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Pre-Test Cleanup
        working-directory: terraform-tests/integration
        run: |
          echo "Cleaning up any orphaned resources before tests..."
          go mod download
          go test -v -timeout 10m -run TestCleanupAllOrphanedResources || true

      - name: Install Terratest Dependencies
        working-directory: terraform-tests/integration
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Run Terratest Integration Tests
        working-directory: terraform-tests/integration
        run: |
          go test -v -timeout 30m -parallel 1 -failfast -skip TestCleanupAllOrphanedResources
        env:
          TF_VAR_environment: ci-test
          TF_VAR_project_name: sp-autopilot-ci

      - name: Cleanup AWS Resources
        if: always()
        working-directory: terraform-tests/integration
        run: |
          echo "Cleaning up any remaining test resources..."
          go test -v -timeout 10m -run TestCleanupAllOrphanedResources || true

      - name: Comment PR with Test Results
        if: false # Disabled: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Integration Tests Failed

            **Terratest integration tests failed.**

            Please review the test results above and fix any failing tests.

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
