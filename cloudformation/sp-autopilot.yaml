Outputs:
  Version:
    Description: SP Autopilot release this stack runs.
    Value: !FindInMap [Release, Package, Version]
  NotificationsTopicArn:
    Description: SNS topic for notifications. Subscribe more addresses or endpoints here.
    Value: !Ref NotificationsTopic
  PurchaseIntentsQueueUrl:
    Description: Queue of purchase intents. Delete a message to cancel that purchase before the purchaser runs.
    Value: !Ref PurchaseIntentsQueue
